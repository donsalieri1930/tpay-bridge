<!doctype html>
<html lang="pl" data-theme=light>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Darowizna — Węgielek</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="dns-prefetch" href="//secure.sandbox.tpay.com">
    <link rel="preconnect" href="https://secure.sandbox.tpay.com" crossorigin>
  </head>
  <body>
    <section class="section">
      <div class="container is-max-desktop">
        <img src="/src/logo.svg" alt="Logo" class="logo">
      </div>
    </section>
    <section class="section mb-6" id="content">
      <div class="container is-max-desktop">
        <div class="card">
          <header class="card-header">
            <p class="card-header-title">Darowizna na cele statutowe stowarzyszenia</p>
          </header>
          <div class="card-content">
            <div class="block">
              <p class="has-text-grey is-size-7 has-text-weight-semibold">Rodzina</p>
              <p id="familyName" class="is-size-5 mb-1">&nbsp;</p>
            </div>
            <div class="block">
              <div class="field">
                <label class="label" for="payer">Wybierz płatnika</label>
                <div class="control">
                  <div class="select is-fullwidth">
                    <select id="payer" name="payer" aria-label="Wybierz płatnika">
                      <option value=0></option>
                      <option value=1></option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
            <div class="block" id="presetAmounts">
              <p class="label">Wybierz kwotę i zapłać</p>
              <div class="field has-addons">
                <p class="control"><button type="button" data-amt="10" class="button">10 zł</button></p>
                <p class="control"><button type="button" data-amt="20" class="button">20 zł</button></p>
                <p class="control"><button type="button" data-amt="50" class="button">50 zł</button></p>
                <p class="control"><button type="button" data-amt="100" class="button">100 zł</button></p>

              </div>
            </div>
            <div class="block">
              <div class="field">
                <label class="label" for="amountInput">Inna kwota</label>
                <div class="control">
                  <input id="amountInput" class="input" type="number" min="1" max="9999" step="1" placeholder="Podaj liczbę od 1 do 9999" />
                </div>
              </div>
            </div>
            <div class="block">
              <div class="field">
                <p class="control">
                  <button id="cta" class="button is-primary is-fullwidth">Zapłać</button>
                </p>
                <p class="help is-size-7 has-text-grey has-text-centered">
                  Zostaniesz przekierowany na stronę operatora.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <div class="container is-max-desktop">
        <p>Kontakt</p>
        <a href="mailto:platnosci@wegielek.edu.pl">platnosci@wegielek.edu.pl</a>
        <p class="mt-5">© Stowarzyszenie na rzecz Edukacji i Rodziny Węgielek</p>
      </div>
    </footer>
    <script type="module" src="/src/before-dom.ts"></script>
    <script type="module" src="/src/load-css.ts"></script>
    <script type="module" src="/src/after-dom-donation.ts"></script>
  </body>
</html>
